# .github/workflows/build.yml
name: Build and Release KAALK Server

on:
  workflow_dispatch:
    inputs:
      version_tag:
        description: 'Manual Release Version (e.g. 1.0.5)'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Server Code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Syntax and Bytecode Compilation Check
        run: |
          python -m compileall app/ run.py

      - name: Resolve Version Identifier
        id: resolve_version
        run: |
          MANUAL="${{ github.event.inputs.version_tag }}"
          if [ -n "$MANUAL" ]; then
            VERSION="$MANUAL"
          elif [ -f "version.txt" ]; then
            BASE=$(cat version.txt | tr -d '[:space:]')
            VERSION="${BASE}.${{ github.run_number }}"
          else
            VERSION="1.0.${{ github.run_number }}"
          fi
          echo "VERSION=$VERSION" >> $GITHUB_ENV
          echo "Target Release Version: $VERSION"

      - name: Package Server Release
        run: |
          mkdir -p dist
          ZIP_NAME="kaalk-server-v${{ env.VERSION }}.zip"
          
          # Create deployment archive excluding git, dev cache, and local databases
          zip -r "dist/${ZIP_NAME}" . \
            -x "*.git*" \
            -x "*.github*" \
            -x "*__pycache__*" \
            -x "*.pyc" \
            -x "*.pyo" \
            -x "*.db" \
            -x "*.sqlite3" \
            -x "*venv*" \
            -x "*.venv*" \
            -x "dist/*" \
            -x "storage/packages/*" \
            -x "storage/media/*"

          cd dist
          sha256sum "${ZIP_NAME}" > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Store Artifact Backup
        uses: actions/upload-artifact@v4
        with:
          name: kaalk-server-v${{ env.VERSION }}
          path: dist/
          retention-days: 90

      - name: Publish Versioned Server Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.VERSION }}
          name: KAALK Server Release v${{ env.VERSION }}
          draft: false
          prerelease: false
          generate_release_notes: true
          files: |
            dist/*.zip
            dist/SHA256SUMS.txt
