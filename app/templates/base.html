<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>{% block title %}KAALK{% endblock %}</title>
    <style>
        :root {
            --bg: #1e1e20;
            --surface: #252526;
            --surface-alt: #333337;
            --accent: #007acc;
            --text: #f1f1f1;
            --muted: #a0a0a5;
            --border: #3f3f46;
            --danger: #d13438;
            --success: #107c41;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
        body { background: var(--bg); color: var(--text); display: flex; flex-direction: column; min-height: 100vh; }
        nav { background: var(--surface); border-bottom: 1px solid var(--border); padding: 12px 24px; display: flex; justify-content: space-between; align-items: center; }
        nav .brand { font-weight: bold; font-size: 1.1rem; color: var(--accent); text-decoration: none; }
        nav .links a { color: var(--text); text-decoration: none; margin-left: 18px; font-size: 0.9rem; }
        nav .links a:hover { color: var(--accent); }
        .container { flex: 1; max-width: 960px; margin: 30px auto; padding: 0 15px; width: 100%; }
        .card { background: var(--surface); border: 1px solid var(--border); border-radius: 6px; padding: 24px; margin-bottom: 20px; }
        .btn { display: inline-block; background: var(--accent); color: #fff; padding: 8px 16px; border-radius: 4px; text-decoration: none; border: none; cursor: pointer; font-size: 0.9rem; font-weight: bold; }
        .btn-success { background: var(--success); }
        .btn-danger { background: var(--danger); }
        input, select, textarea { width: 100%; background: var(--surface-alt); border: 1px solid var(--border); color: var(--text); padding: 8px 12px; border-radius: 4px; margin-top: 6px; margin-bottom: 14px; font-size: 0.9rem; }
        label { font-size: 0.85rem; color: var(--muted); font-weight: 600; }
        table { width: 100%; border-collapse: collapse; margin-top: 15px; font-size: 0.9rem; }
        th, td { border: 1px solid var(--border); padding: 10px; text-align: left; }
        th { background: var(--surface-alt); }
        .alert { background: var(--surface-alt); border-left: 4px solid var(--accent); padding: 10px 14px; margin-bottom: 15px; font-size: 0.85rem; }
        .badge { display: inline-block; padding: 2px 6px; border-radius: 3px; font-size: 0.75rem; font-weight: bold; }
        .badge-pro { background: var(--accent); color: #fff; }
        .badge-free { background: var(--surface-alt); color: var(--muted); }
    </style>
</head>
<body>
    <nav>
        <a href="/pricing" class="brand">KAALK Portal</a>
        <div class="links">
            {% if user %}
                <a href="/dashboard">Dashboard</a>
                <a href="/pricing">Pricing</a>
                {% if user.is_admin %}
                    <a href="/admin/assets" style="color: #ff9800;">Assets</a>
                    <a href="/admin/pricing" style="color: #ff9800;">Plans</a>
                    <a href="/admin/users" style="color: #ff9800;">Users</a>
                {% endif %}
                <a href="/logout">Logout</a>
            {% else %}
                <a href="/pricing">Pricing</a>
                <a href="/login">Sign In</a>
                <a href="/register">Sign Up</a>
            {% endif %}
        </div>
    </nav>
    <div class="container">
        {% block content %}{% endblock %}
    </div>
</body>
</html>
