{% extends "base.html" %}
{% block title %}Checkout - KAALK{% endblock %}
{% block content %}
<div class="card" style="max-width: 500px; margin: auto;">
    <h2>Subscribe to KAALK Pro</h2>
    <p style="color: var(--muted); margin-top: 6px; font-size: 0.9rem;">Enjoy full access to all professional AutoCAD tools, updates, and utilities.</p>
    <hr style="border: 0; border-top: 1px solid var(--border); margin: 18px 0;">
    
    <div style="display: flex; justify-content: space-between; font-weight: bold; margin-bottom: 12px;">
        <span>Plan:</span>
        <span>1 Month Pro Pass</span>
    </div>
    <div style="display: flex; justify-content: space-between; font-weight: bold; font-size: 1.2rem; color: var(--accent); margin-bottom: 24px;">
        <span>Amount Due:</span>
        <span>$15.00</span>
    </div>
    
    <form action="/checkout/activate" method="POST">
        <button type="submit" class="btn btn-success" style="width: 100%; padding: 12px;">Confirm & Activate Subscription</button>
    </form>
</div>
{% endblock %}
