{% extends "base.html" %}
{% block title %}Sign In - KAALK{% endblock %}
{% block content %}
<div class="card" style="max-width: 400px; margin: auto;">
    <h2>Sign In</h2>
    {% if error %}
        <div class="alert" style="border-left-color: var(--danger); margin-top: 12px;">{{ error }}</div>
    {% endif %}
    <form action="/login" method="POST" style="margin-top: 14px;">
        <label>Email Address</label>
        <input type="email" name="email" required>
        <label>Password</label>
        <input type="password" name="password" required>
        <button type="submit" class="btn" style="width: 100%; margin-top: 10px;">Sign In</button>
    </form>
</div>
{% endblock %}
