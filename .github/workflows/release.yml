# .github/workflows/build.yml
name: Build KAALK Asset Manager

on:
  workflow_dispatch:
    inputs:
      release_notes:
        description: 'Release Notes (Optional)'
        required: false
        default: 'Manual production build'
        type: string

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Work out the version
        id: version
        shell: pwsh
        run: |
          $baseVersion = (Get-Content -Path "version.txt" -Raw).Trim()
          $fullVersion = "$baseVersion.${{ github.run_number }}"
          $shortCommit = "${{ github.sha }}".Substring(0, 7)
          Write-Host "Computed Version: $fullVersion"
          "version=$fullVersion" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          "commit=$shortCommit" | Out-File -FilePath $env:GITHUB_OUTPUT -Append

      - name: Check architecture rules
        shell: cmd
        run: Check-Architecture.cmd

      - name: Compile plugin assembly
        shell: pwsh
        run: |
          ./build/Build.ps1 -Version "${{ steps.version.outputs.version }}" -Commit "${{ steps.version.outputs.commit }}"

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: KaalkAssetManager-v${{ steps.version.outputs.version }}
          path: dist/
          retention-days: 90

      - name: Publish GitHub Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: pwsh
        run: |
          $ver = "${{ steps.version.outputs.version }}"
          $zipPath = "dist/KaalkAssetManager-v$ver.zip"
          $dllPath = "dist/$ver/KaalkAssetManager.dll"
          $notes = "${{ inputs.release_notes }}"
          
          gh release create "v$ver" $zipPath $dllPath --title "v$ver" --notes "$notes"
