{% extends "base.html" %}
{% block title %}Sign Up - KAALK{% endblock %}
{% block content %}
<div class="card" style="max-width: 440px; margin: auto;">
    <h2>Create Account</h2>
    {% if error %}
        <div class="alert" style="border-left-color: var(--danger); margin-top: 12px;">{{ error }}</div>
    {% endif %}
    <form action="/register" method="POST" style="margin-top: 14px;">
        <label>First Name</label>
        <input type="text" name="first_name" required>

        <label>Last Name</label>
        <input type="text" name="last_name" required>

        <label>Email Address</label>
        <input type="email" name="email" required>

        <label>Phone Number (Mobile)</label>
        <input type="tel" name="phone" placeholder="0912..." required>

        <label>Password</label>
        <input type="password" name="password" required>

        <button type="submit" class="btn" style="width: 100%; margin-top: 10px;">Sign Up</button>
    </form>
</div>
{% endblock %}
